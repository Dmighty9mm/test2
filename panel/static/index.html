<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PlebMc Panel</title>
<link rel="icon" type="image/png" href="/static/favicon.png">
<link rel="stylesheet" href="/static/style.css">
<script src="/static/app.js" defer></script>
</head>
<body>
<div class="shell">
  <aside class="side" id="side">
    <a class="brand" href="#home"><img src="/static/logo.png" alt=""><span><span id="site">PlebMc</span><small>Panel</small></span></a>
    <nav id="nav"></nav>
    <div class="foot">Coins and cosmetics update from the server about once a minute.</div>
  </aside>
  <div class="main">
    <header class="topbar">
      <button class="menu-btn ghost small" id="menu" aria-label="Menu" aria-expanded="false">Menu</button>
      <div class="title" id="title"></div>
      <div class="who" id="who"></div>
    </header>
    <main id="app"><div class="skeleton"></div></main>
  </div>
</div>

</html>
