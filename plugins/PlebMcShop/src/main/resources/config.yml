  angel_wings:  {name: 'Angel Wings', category: wings, render: angel, price: 8000, description: 'White feathered wings'}
  golden_wings: {name: 'Golden Wings', category: wings, render: angel, color: '#E8B923', price: 15000, description: 'Feathers of pure gold'}
  demon_wings:  {name: 'Demon Wings', category: wings, render: demon, price: 8000, description: 'Dark red and spiky'}
  dragon_wings: {name: 'Dragon Wings', category: wings, render: dragon, price: 12000, description: 'Scaled wings with claws'}
  butterfly_wings: {name: 'Butterfly Wings', category: wings, render: butterfly, price: 6000, description: 'Bright and fluttery'}
  bat_wings:    {name: 'Bat Wings', category: wings, render: bat, price: 5000, description: 'For night owls (and bats)'}

  # Partner cosmetics go in the Partners tab. For example:
  # streamer_cloak: {name: 'Streamer Cloak', category: cloak, texture: 'cloaks/streamer.png', collection: partners, creator: 'SomeStreamer', price: 5000, description: 'Made with SomeStreamer'}
  # streamer_hat:   {name: 'Streamer Crown', category: hat, model: 'hats/streamer.bbmodel', collection: partners, creator: 'SomeStreamer', price: -1, description: 'Given out on stream'}

# Votes on server lists (eaglercraftservers.com and others) pay coins. The client's
# Vote button and /vote open 'url'. Server lists tell PlebioAPI about votes over
# Votifier: run 'pleb votifier' in the proxy console for the port, token and public
# key to paste into the server list's Votifier settings, and open that TCP port.
# Already running NuVotifier? Set votifier.enabled: false and have NuVotifier run
# 'pleb vote {username}' for each vote. One vote per player is paid every 5 minutes at most.
voting:
  enabled: true
  reward: 100
  url: 'https://eaglercraftservers.com/server/plebmc'
  announce: true
  announce-message: '&b%player% &7voted for PlebMc and got &e%amount% %currency%&7! Vote too: &f/vote'
  votifier:
    enabled: true
    host: 0.0.0.0
    port: 8192

# Item packs a PlebioAPI update already added to your items (so ones you delete
# don't come back). Leave this alone.
added-item-packs: [wings]
